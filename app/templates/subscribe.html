{% block content %}

<body class="blog">
	<div id="page">
		<div class="container">
			<div
				id="content"
				class="site-content">
				<div
					id="primary"
					class="content-area column two-thirds">
					<main
						id="main"
						class="site-main"
						role="main">
						<form method="post">
							{% csrf_token %} {{ form.as_p }}
							<button type="submit">Subscribe</button>
						</form>
					</main>
				</div>
			</div>
		</div>
	</div>
</body>

{% endblock %}
