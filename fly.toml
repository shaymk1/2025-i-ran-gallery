# fly.toml app configuration file generated for in-2025-i-ran-blog on 2025-05-15T13:57:09+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'in-2025-i-ran-blog'
primary_region = 'jnb'
console_command = '/code/manage.py shell'

[build]
  dockerfile = "Dockerfile"

[deploy]
  #release_command = 'python manage.py migrate --noinput'

[env]
  PORT = '8000'
  DJANGO_SETTINGS_MODULE = "core.settings"
  PYTHONUNBUFFERED = "1"
  ALLOWED_HOSTS = "localhost,127.0.0.1,in-2025-i-ran-blog.fly.dev"


[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  memory = "256MB" 
  cpu_kind = "shared"
  cpu_cores = 1


[processes]
  app = "gunicorn core.wsgi:application --bind=0.0.0.0:8000"


[[statics]]
  guest_path = '/code/staticfiles'
  url_prefix = '/static/'
