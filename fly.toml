# fly.toml app configuration file generated for in-2025-i-ran-blog on 2025-05-15T13:57:09+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'in-2025-i-ran-blog'
primary_region = 'jnb'
console_command = '/code/manage.py shell'

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  PORT = '8000'
  DJANGO_SETTINGS_MODULE = "core.settings"
  PYTHONUNBUFFERED = "1"

[processes]
  app = "gunicorn core.wsgi:application --bind=0.0.0.0:8000"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
