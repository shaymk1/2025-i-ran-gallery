{% extends "base.html" %} {% block content %}
<div class="container mt-5">
	<div class="row justify-content-center">
		<div class="col-md-6">
			<div class="card">
				<div class="card-header">Login</div>
				<div class="card-body">
					<form
						method="post"
						action="{% url 'login' %}">
						{% csrf_token %}
						<!-- Hidden 'next' field for redirect -->

						<input
							type="hidden"
							name="next"
							value="{{ request.GET.next }}" />

						<!-- Username Field -->
						<div class="mb-3">
							<label
								for="username"
								class="form-label"
								>Username</label
							>
							<input
								type="text"
								class="form-control"
								id="username"
								name="username" />
							<!-- name="username" is REQUIRED -->
						</div>

						<!-- Password Field -->
						<div class="mb-3">
							<label
								for="password"
								class="form-label"
								>Password</label
							>
							<input
								type="password"
								class="form-control"
								id="password"
								name="password" />
							<!-- name="password" is REQUIRED -->
						</div>

						<button
							type="submit"
							class="btn btn-primary">
							Login
						</button>
						<a href="{% url 'home' %}"class="btn btn-secondary" style="background-color:red;color:white;" >Cancel</a>
						
					</form>

			
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}
